<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailwind in one file</title>
<script src="https://cdn.tailwindcss.com"></script>
<style data-tailwind></style>
</head>
<body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 font-sans">
  <main class="mx-auto max-w-2xl px-4 py-10">
    <h1 class="text-3xl font-semibold tracking-tight text-balance">Compiled once, inlined, offline</h1>
    <p class="mt-2 text-stone-700 dark:text-stone-300">Only the classes in this page are in the CSS.</p>

      <button type="button" class="mt-4 min-h-11 rounded-xl border border-indigo-700 bg-indigo-700 px-4 text-white hover:bg-indigo-800 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-indigo-900 motion-safe:transition-colors">Continue</button>
      <p class="mt-3 text-[0.8125rem] text-stone-600 dark:text-stone-400">Arbitrary values compile too.</p>

  </main>
  <script>window.__done = true;</script>
