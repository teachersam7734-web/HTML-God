<!doctype html>
<!--
  gpu-tier.html: the opt-in WebGPU tier. three's WebGPURenderer with a TSL node material (fresnel rim plus world-space
  scanlines, the hologram look in node form), `await renderer.init()` before the first render(), the real backend read
  from renderer.backend.isWebGPUBackend, a still fallback when the renderer cannot start, reduced motion, pause when
  hidden, a seekable uniform for time. A hand-written ShaderMaterial would NOT render here (see the skill's TRAPS):
  every GLSL material has to be rewritten as nodes.
  Build: node ../scripts/build-vendor.mjs vendor entry-gpu.js
  verified: Windows 10, Chrome 155 + SwiftShader, three 0.186.1, on the WebGL2 FALLBACK backend only (navigator.gpu
            exists here but requestAdapter() returns null): renders, frames differ at two times, reduced motion is
            still, no console errors; a WebGL context loss recovered only by swapping in a fresh canvas and a new renderer.
  not verified: the WebGPU backend itself, on any device (its device-lost path is not handled here).
  Original code of this project.
-->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebGPU tier</title>
<style>html,body{margin:0;height:100%;background:#02060a;color:#cfe;font:13px system-ui}canvas{display:block;width:100%;height:100%}
#o{position:fixed;left:8px;top:8px;margin:0;font:12px monospace;color:#7fd}.msg{position:fixed;inset:0;display:none;place-items:center}</style>
<canvas id="c" role="img" aria-label="A glowing knot drawn with WebGPU when available"></canvas><pre id="o"></pre>
<p class="msg" id="msg">This effect needs WebGPU or WebGL 2. A still image would go here.</p>
<script src="vendor/t-gpu.js"></script>
<script>
(async () => {
const { WebGPURenderer, Scene, PerspectiveCamera, Mesh, TorusKnotGeometry, MeshBasicNodeMaterial, AdditiveBlending, DoubleSide, tsl } = G;
const { color, sin, uniform, normalWorld, cameraPosition, positionWorld, normalize, dot, pow, abs, float, max } = tsl;
let canvas = document.getElementById('c'); const q = new URLSearchParams(location.search);
const FIXED_T = q.has('t') ? +q.get('t') : null, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let adapter = 'none';
try { if (navigator.gpu) adapter = (await navigator.gpu.requestAdapter()) ? 'yes' : 'null'; } catch { adapter = 'error'; }
let renderer;
const makeRenderer = async () => { const r = new WebGPURenderer({ canvas, antialias: true, forceWebGL: q.get('gl') === '1' }); await r.init(); return r; };
try { renderer = await makeRenderer(); }
catch (e) { document.getElementById('msg').style.display = 'grid'; canvas.remove(); console.warn('no renderer: ' + e.message); window.__done = true; return; }
const backend = renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2 fallback';   // constructor names are minified: use the flag
document.getElementById('o').textContent = `adapter: ${adapter}\nbackend: ${backend}`;

const uT = uniform(0);                                     // our own time: seekable (the built-in time node is not)
const V = normalize(cameraPosition.sub(positionWorld));
const fres = pow(float(1).sub(abs(dot(V, normalWorld))), 2.6);
const scan = sin(positionWorld.y.mul(90).sub(uT.mul(6))).mul(.5).add(.5);
const m = new MeshBasicNodeMaterial({ transparent: true, depthWrite: false, blending: AdditiveBlending, side: DoubleSide });
m.colorNode = color('#35d8ff').mul(fres.mul(1.7).add(.22)).mul(pow(scan, 3).mul(.65).add(.35));
const scene = new Scene(), cam = new PerspectiveCamera(38, 1, .1, 100); cam.position.set(0, .2, 8.6);
const mesh = new Mesh(new TorusKnotGeometry(1.3, .38, 220, 28), m); scene.add(mesh);
function size() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
const ro = new ResizeObserver(size); ro.observe(canvas); size();
function frame(t) { uT.value = t; mesh.rotation.y = t * .35; mesh.rotation.x = Math.sin(t * .4) * .25; renderer.render(scene, cam); }
window.__seek = frame;
let raf = 0, t0 = performance.now(), el = 0;
const loop = now => { raf = requestAnimationFrame(loop); el = (now - t0) / 1000; frame(el); };
if (FIXED_T !== null || reduce) frame(FIXED_T ?? 1); else { frame(0); raf = requestAnimationFrame(loop); }
// Context loss: WebGPURenderer on the WebGL2 fallback did not redraw after a restore, and rebuilding it on the same
// canvas lost the context again (both tested). So: on loss, swap in a fresh canvas and build a new renderer on it.
function watchLoss(cv) {
  cv.addEventListener('webglcontextlost', async e => {
    e.preventDefault(); cancelAnimationFrame(raf); raf = 0;
    const fresh = cv.cloneNode(false); cv.replaceWith(fresh); canvas = fresh; ro.disconnect(); ro.observe(fresh);
    renderer = await makeRenderer(); watchLoss(fresh); size();
    if (FIXED_T === null && !reduce) { t0 = performance.now() - el * 1000; raf = requestAnimationFrame(loop); } else frame(FIXED_T ?? 1);
  }, { once: true });
}
watchLoss(canvas);
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (FIXED_T === null && !reduce && !raf) { t0 = performance.now() - el * 1000; raf = requestAnimationFrame(loop); } });
window.__done = true;
})();
</script>
