<!doctype html>
<!--
  sting.html: an eight-second seek-safe motion graphic (1920x1080, 30 fps) that shows the craft rules in one piece:
  words rise on uneven gaps with a vertical smear and an accent tint, a designed breath with a camera creep, the
  full stop is the carried object and grows into the next ground (T3, the effect becomes the next scene), a whip
  entry with horizontal smear, a one-frame camera punch with a soft tail, words resolving by blur focus, one late
  popOver, and an ending that is still moving. Every value is a pure function of t; there is no clock in the page.

  verified: headless Chrome on Windows 10 (system Chrome, SwiftShader flags): sequential and out-of-order seeks give
            identical screenshot hashes at 8 times straddling every hand-off (scripts/test-examples.mjs); stills and a
            contact sheet were looked at; HTML-Sensei lint-determinism reports it clean.
  not verified: font metrics on other machines (it uses the Georgia stack, so layout can shift where Georgia is
            missing; a delivered film embeds its fonts, see sensei-typography); Safari and Firefox.

  Contract: window.__seek(t) and window.seek(t); window.__meta {dur,fps,w,h}; window.__ready (a promise) and
  window.READY; window.__events (sound cues derived from the same numbers the picture uses). Open with ?t=4.4 to
  pin a frame. Live preview and reduced motion live in a player page (sensei-video-pipeline examples/player.html),
  never in the film, so the film stays free of clocks.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sting: read like a detective</title>
<style>
  html, body { margin: 0; background: #14121a; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #14121a; }
  #world, #scene2 { position: absolute; inset: 0; transform-origin: 960px 540px; }
  #line { position: absolute; left: 0; right: 0; top: 452px; text-align: center; white-space: nowrap;
          font: 700 150px/1 Georgia, 'Times New Roman', serif; color: #f3eee4; letter-spacing: -0.01em; }
  .w { display: inline-block; margin: 0 0.12em; }
  #dot { display: inline-block; width: 0.2em; height: 0.2em; border-radius: 50%; background: #f2542d; margin-left: 0.04em; }
  #bead { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #f2542d; display: none; }
  #scene2 { display: none; }
  #ring { position: absolute; left: 520px; top: 340px; width: 400px; height: 400px; border-radius: 50%;
          box-sizing: border-box; border: 26px solid #14121a; }
  #ring::after { content: ""; position: absolute; width: 34px; height: 170px; background: #14121a; border-radius: 17px;
          left: 312px; top: 300px; transform: rotate(-45deg); transform-origin: 17px 0; }
  #line2 { position: absolute; left: 1000px; top: 470px; white-space: nowrap;
           font: 700 128px/1 Georgia, 'Times New Roman', serif; color: #14121a; }
  .v { display: inline-block; margin-right: 0.22em; }
  #grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.027; }
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <filter id="sm0" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="sm1" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="sm2" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="sm3" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="smR" x="-60%" y="-20%" width="220%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
  </defs></svg>
  <div id="world">
    <div id="line"><span class="w">Read</span><span class="w">like</span><span class="w">a</span><span class="w">detective<span id="dot"></span></span></div>
    <div id="bead"></div>
  </div>
  <div id="scene2">
    <div id="ring"></div>
    <div id="line2"><span class="v">Find</span><span class="v">the</span><span class="v">clue.</span></div>
  </div>
  <div id="grain"></div>
</div>
<script src="../scripts/motion-kit.js"></script>
<script>
(() => {
  'use strict';
  const K = window.SenseiMotion, E = K.EASE, FPS = 30, W = 1920, H = 1080, DUR = 8;
  const f = n => n / FPS;                                   // frames to seconds
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const INK = [243, 238, 228], ACCENT = [242, 84, 45];
  const rgb = (a, b, k) => `rgb(${a.map((v, i) => Math.round(K.lerp(v, b[i], k))).join(',')})`;

  // ---- the plan: one table of numbers that the picture and the sound cues both read ----
  const P = {
    wordOn: [-4, 0, 3, 9].map(f),           // uneven gaps 4, 3, 6 frames; frame 0 is already mid-rise (never an empty first frame)
    rise: 0.05 * H, riseF: 12, fadeF: 5, smearPx: 14,
    tintF: 6,
    carry: 3.65, coverF: 18,                  // the full stop becomes the next ground
    exitF: 13,
    ringOn: 4.25, ringF: 7, ringFrom: 0.6 * W, ringSmear: 40,
    punch: 4.85, punchTo: 0.74, tailF: 14,
    words2: 5.05, word2F: 4,
    dock: 5.65, dockF: 15,
    settle: 6.60,
  };
  window.__events = [
    { t: 0, type: 'tick' }, { t: P.wordOn[3], type: 'tick' },
    { t: P.carry, type: 'swell' }, { t: P.ringOn + f(P.ringF), type: 'thump' },
    { t: P.punch, type: 'hit' }, { t: P.dock + f(P.dockF) * 0.72, type: 'chime' },
  ];

  // ---- measured once after fonts load; seek never measures or accumulates ----
  const M = {};
  function measure() {
    const dot = $('#dot'), world = $('#world');
    let x = dot.offsetWidth / 2, y = dot.offsetHeight / 2, n = dot;
    while (n && n !== world) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
    M.dot = { x, y, d: dot.offsetWidth };
    const far = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([cx, cy]) => Math.hypot(cx - x, cy - y)));
    M.zMax = (2 * far + 40) / 30;           // bead diameter 30 px must exceed the farthest corner
    // fixed film grain: seeded noise, alpha about 7/255, kills banding on dark grounds after yuv420p
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d'), img = g.createImageData(256, 256), r = K.rng('grain');
    for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    g.putImageData(img, 0, 0);
    $('#grain').style.background = `url(${c.toDataURL()}) repeat`;
  }

  function blur(id, sx, sy) {                // SVG directional blur; 'none' when idle so it costs nothing
    const fe = document.querySelector(`#${id} feGaussianBlur`); fe.setAttribute('stdDeviation', `${sx.toFixed(2)} ${sy.toFixed(2)}`);
    return sx + sy > 0.05 ? `url(#${id})` : 'none';
  }

  function seek(t) {
    const words = $$('.w');
    // camera: a linear creep keeps the breath alive (no dead frame), then the carry takes over
    const cam = K.lerp(1, 1.035, K.seg(t, 0, P.carry + f(P.coverF)));
    $('#world').style.transform = `scale(${cam})`;

    words.forEach((el, i) => {
      const on = P.wordOn[i], fr = (t - on) * FPS;
      const land = E.softLand(K.seg(t, on, on + f(P.riseF)));
      const leave = E.accelExit(K.seg(t, P.carry, P.carry + f(P.exitF)));
      const y = (1 - land) * P.rise - leave * 0.07 * H;
      const op = t < on ? 0 : K.lerp(0.2, 1, K.seg(t, on, on + f(P.fadeF))) * (1 - K.seg(t, P.carry + f(P.exitF - 4), P.carry + f(P.exitF)));
      const sm = K.smear(Math.floor(fr), P.smearPx) + (t > P.carry ? K.smear(Math.floor((P.carry + f(P.exitF) - t) * FPS), 10) : 0);
      el.style.transform = `translateY(${y.toFixed(2)}px)`;
      el.style.opacity = op.toFixed(3);
      el.style.filter = blur(`sm${i}`, 0, sm);
      el.style.color = i === 3 ? rgb(ACCENT, INK, E.softInOut(K.seg(t, on, on + f(P.tintF)))) : '';
    });
    // the full stop stays put while its word leaves: from the carry frame the bead takes its place, same pixel
    const carried = t >= P.carry;
    $('#dot').style.visibility = carried ? 'hidden' : 'visible';
    const grow = E.crashOut(K.seg(t, P.carry, P.carry + f(P.coverF)));
    const covered = t >= P.carry + f(P.coverF);
    const bead = $('#bead');
    bead.style.display = carried && !covered ? 'block' : 'none';
    bead.style.left = M.dot.x + 'px'; bead.style.top = M.dot.y + 'px';
    bead.style.transform = `scale(${(K.zoomAt(M.dot.d / 30, M.zMax, grow)).toFixed(4)})`;
    $('#world').style.display = covered ? 'none' : 'block';
    $('#stage').style.background = covered ? rgb(ACCENT, ACCENT, 0) : '#14121a';

    // scene 2 on the new ground
    const s2 = $('#scene2');
    s2.style.display = covered ? 'block' : 'none';
    const punch = t < P.punch ? 1 : K.lerp(P.punchTo, 0.82, E.softLand(K.seg(t, P.punch + f(1), P.punch + f(P.tailF))));
    const lock = K.lerp(1, 0.965, K.seg(t, P.settle, DUR));             // ends mid-motion: still shrinking on the last frame
    const [hx, hy] = K.shake(t, P.punch, { amp: 7, decay: 11, seed: 'punch' });
    s2.style.transform = `translate(${hx.toFixed(2)}px, ${hy.toFixed(2)}px) scale(${(punch * lock).toFixed(4)})`;

    const rIn = E.whip(K.seg(t, P.ringOn, P.ringOn + f(P.ringF)));
    const rFr = Math.floor((t - P.ringOn) * FPS);
    const rSm = rFr >= 0 && rFr < P.ringF ? P.ringSmear * (1 - rIn) + 4 : K.smear(rFr - P.ringF, 4);
    const dock = K.kf(t, [[0, 1], [P.dock, 0.9], [P.dock + f(P.dockF), 1, 'popOver']]);
    const ring = $('#ring');
    ring.style.transform = `translateX(${((1 - rIn) * P.ringFrom).toFixed(2)}px) scale(${dock.toFixed(4)})`;
    ring.style.filter = blur('smR', rSm, 0);

    $$('.v').forEach((el, i) => {
      const on = P.words2 + f(i * P.word2F), k = K.seg(t, on, on + f(P.word2F));
      el.style.opacity = t < on ? '0' : K.lerp(0.1, 1, E.glide(k)).toFixed(3);
      el.style.filter = k < 1 ? `blur(${(12 * (1 - E.glide(k))).toFixed(2)}px)` : 'none';
    });
    return true;
  }

  window.__meta = { dur: DUR, fps: FPS, w: W, h: H };
  window.__seek = window.seek = seek;
  window.__ready = document.fonts.ready.then(() => {
    measure();
    const pin = new URLSearchParams(location.search).get('t');
    seek(pin ? +pin : 0);
    window.READY = true;
    return true;
  });
})();
</script>
</body>
</html>
