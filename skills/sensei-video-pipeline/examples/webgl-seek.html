<!doctype html>
<!--
  webgl-seek.html: a raw WebGL2 film page, pure in t: one full-screen fragment shader whose only time input is the
  uniform set by seek(t). Shows the WebGL side of the contract: draw synchronously inside seek, keep the drawing
  buffer for capture, an opaque canvas (no alpha compositing surprises), a context-loss handler that redraws the
  last t, and the renderer string so a report can say whether a GPU or SwiftShader drew it.

  verified: headless Chrome 155 on Windows 10 with SwiftShader (ANGLE Vulkan SwiftShader): render.mjs --probe gives
            identical hashes in and out of order; rendered to MP4.
  not verified: a real GPU (expected to match within a few code values, not bit for bit; never mix GPU and
            SwiftShader frames in one film); Safari and Firefox.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGL seek page</title>
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; width: 1280px; height: 720px; }</style>
</head>
<body>
<canvas id="c" width="1280" height="720" role="img" aria-label="Rings of light turning and opening"></canvas>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('c');
  let gl, prog, uT, uR, lastT = 0;
  const VS = `#version 300 es
  in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
  const FS = `#version 300 es
  precision highp float; uniform float uT; uniform vec2 uR; out vec4 o;
  void main() {
    vec2 q = (gl_FragCoord.xy - 0.5 * uR) / uR.y;
    float r = length(q), a = atan(q.y, q.x);
    float open = 1.0 - exp(-1.6 * uT);                         // rings open, pure in t
    float k = 0.0;
    for (int i = 0; i < 5; i++) {
      float fi = float(i), rad = 0.08 + 0.07 * fi * open;
      float w = 0.004 + 0.002 * fi;
      float wave = 0.01 * sin(6.0 * a + uT * (1.5 + fi) + fi);
      k += w / abs(r - rad - wave);
    }
    vec3 col = k * mix(vec3(1.0, 0.42, 0.24), vec3(0.3, 0.7, 1.0), 0.5 + 0.5 * sin(uT * 0.9));
    o = vec4(col / (1.0 + col), 1.0);                          // tone map, opaque
  }`;
  function init() {
    gl = cv.getContext('webgl2', { alpha: false, antialias: true, preserveDrawingBuffer: true });
    if (!gl) { document.body.textContent = 'WebGL2 is not available in this browser.'; return false; }
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
    gl.useProgram(prog);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uT = gl.getUniformLocation(prog, 'uT'); uR = gl.getUniformLocation(prog, 'uR');
    return true;
  }
  function seek(t) {
    lastT = t;
    if (!gl || gl.isContextLost()) return false;
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform1f(uT, t); gl.uniform2f(uR, cv.width, cv.height);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    return true;
  }
  cv.addEventListener('webglcontextlost', e => e.preventDefault());
  cv.addEventListener('webglcontextrestored', () => { init(); seek(lastT); });
  const ok = init();
  window.__meta = { dur: 3, fps: 30, w: 1280, h: 720 };
  window.__seek = window.seek = seek;
  window.__ready = Promise.resolve(ok).then(v => { seek(0); window.READY = v; return v; });
})();
</script>
</body>
</html>
