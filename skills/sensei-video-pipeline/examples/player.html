<!doctype html>
<!--
  player.html: one page that is both a film (render.mjs opens it with ?render and gets a clean, clock-free page) and
  an interactive player (scrub, play, captions, reduced motion) for a lesson or deck. The film part is a small
  seek page; the player part is scripts/player.js, mounted last.

  verified: headless Chrome 155 on Windows 10 via Playwright (test-pipeline.mjs): controls render, play advances,
            scrub seeks, reduced-motion emulation shows the poster without playing, ?render has no controls and
            render.mjs --probe is deterministic.
  not verified: audio playback on a device; Safari and Firefox; screen readers.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film with a player</title>
<style>
  html, body { margin: 0; background: #f4f1ea; color: #1b1a17; }
  main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #1b1a17; }
  .dot { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; background: #e2583e; }
  #word { position: absolute; left: 0; right: 0; top: 520px; text-align: center; color: #f4f1ea; font: 700 72px/1 Georgia, serif; }
</style>
</head>
<body>
<main>
  <h1>Skim, then scan</h1>
  <div id="stage" role="img" aria-label="Three dots arrive one by one, then the word Scan appears">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div id="word">Scan</div>
  </div>
</main>
<script>
(() => {
  'use strict';
  const dots = [...document.querySelectorAll('.dot')], word = document.getElementById('word');
  const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  const land = k => (1 - Math.exp(-3.41 * k)) / (1 - Math.exp(-3.41));        // softLand shape
  function seek(t) {
    dots.forEach((d, i) => {
      const k = land(seg(t, 0.2 + i * 0.13, 0.6 + i * 0.13));
      d.style.left = (420 + i * 220) + 'px';
      d.style.top = (360 - (1 - k) * 260) + 'px';
      d.style.opacity = String(Math.min(1, k * 4));
    });
    const w = land(seg(t, 1.3, 1.7));
    word.style.transform = `translateY(${((1 - w) * 40).toFixed(1)}px)`;
    word.style.opacity = String(w);
    return true;
  }
  window.__meta = { dur: 3, fps: 30, w: 1280, h: 720 };
  window.__seek = window.seek = seek;
  window.__ready = document.fonts.ready.then(() => { seek(0); window.READY = true; return true; });
})();
</script>
<script src="../scripts/player.js"></script>
<script>
  window.player = SenseiPlayer.mount({ stage: '#stage', poster: 'end',
    captions: [{ t: 0.2, end: 1.3, text: 'Skim first: the shape of the page.' }, { t: 1.3, end: 3, text: 'Then scan for the word you need.' }] });
</script>
</body>
</html>
