<!doctype html>
<!--
  sweep.html: a "scan swap" between two holograms, driven by one progress value. Both meshes use the same shader;
  the outgoing one is discarded below the sweep line and the incoming one above it, with a bright seam. The sweep
  runs in world Y normalised by bounds taken from each mesh's BOUNDING SPHERE in world space (rotation cannot change
  it), which fixes the reference repo's un-rotated box bounds that made the line end early or late.
  Cycle: 2 s hold, 2 s sweep, roles swap. Pure function of t; ?t= and window.__seek as usual; reduced motion holds a
  still. window.__sweepTest() renders progress 0 and 1 and counts each mesh's pixels by colour.
  Build: node ../../sensei-3d/scripts/build-vendor.mjs vendor entry-min.js
  verified: Windows 10, Chrome 155 + SwiftShader, three 0.186.1: at progress 0 only the outgoing mesh has pixels and
            at 1 only the incoming one (counts in the skill's Verification section); gate3d.mjs passed.
  not verified: frame rate on a target GPU.
  Original code of this project; the sweep idea is from a reference-only repo (no licence file), re-implemented.
-->
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hologram sweep swap</title>
<style>html,body{margin:0;height:100%;background:#02060a}canvas{display:block;width:100%;height:100%}</style>
<canvas id="c" role="img" aria-label="A hologram knot that scans into a hologram crystal and back"></canvas>
<script src="vendor/t-min.js"></script>
<script>
(() => {
const { WebGLRenderer, Scene, PerspectiveCamera, ShaderMaterial, Mesh, TorusKnotGeometry, IcosahedronGeometry, Color, Vector3, AdditiveBlending, DoubleSide } = T;
const canvas = document.getElementById('c'), q = new URLSearchParams(location.search);
const FIXED_T = q.has('t') ? +q.get('t') : null, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const r = new WebGLRenderer({ canvas, antialias: true });
const scene = new Scene(), cam = new PerspectiveCamera(38, 1, .1, 100); cam.position.set(0, .2, 8.6);
const VS = `varying vec3 vW; varying vec3 vN;
  void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * viewMatrix * w; }`;
const FS = `uniform float uTime, uProgress, uOutgoing, uMinY, uMaxY; uniform vec3 uColor; varying vec3 vW; varying vec3 vN;
  void main(){
    float ny = (vW.y - uMinY) / (uMaxY - uMinY);                      // 0 at the bottom of the bounds, 1 at the top
    if (uOutgoing > 0.5 && ny < uProgress) discard;                   // old: eaten from the bottom up
    if (uOutgoing < 0.5 && ny > uProgress) discard;                   // new: built from the bottom up
    vec3 V = normalize(cameraPosition - vW);
    float fres = pow(1.0 - abs(dot(V, normalize(vN))), 2.6);
    float scan = mix(.35, 1., pow(.5 + .5 * sin(vW.y * 90. - uTime * 6.), 3.));
    float seam = (1.0 - smoothstep(0.0, 0.03, abs(ny - uProgress))) * step(0.001, uProgress) * step(uProgress, 0.999);
    vec3 rgb = uColor * (.22 + fres * 1.7) * scan + uColor * seam * 2.0;
    gl_FragColor = vec4(rgb, max(rgb.r, max(rgb.g, rgb.b)));
  }`;
function holo(geo, hex) {
  const m = new ShaderMaterial({ vertexShader: VS, fragmentShader: FS, transparent: true, depthWrite: false, blending: AdditiveBlending, side: DoubleSide,
    uniforms: { uTime: { value: 0 }, uProgress: { value: 0 }, uOutgoing: { value: 1 }, uMinY: { value: -1 }, uMaxY: { value: 1 }, uColor: { value: new Color(hex) } } });
  const mesh = new Mesh(geo, m); geo.computeBoundingSphere(); scene.add(mesh); return mesh;
}
const A = holo(new TorusKnotGeometry(1.2, .36, 220, 28), '#35d8ff');     // cyan
const B = holo(new IcosahedronGeometry(1.7, 1), '#ffb03a');             // amber
const centre = new Vector3();
function bounds(mesh) {                                                   // world-space, rotation-invariant
  mesh.updateMatrixWorld(); const s = mesh.geometry.boundingSphere; centre.copy(s.center).applyMatrix4(mesh.matrixWorld);
  const rad = s.radius * mesh.matrixWorld.getMaxScaleOnAxis(); return [centre.y - rad, centre.y + rad];
}
function setState(t, progress, outgoing, incoming) {
  for (const [m, out] of [[outgoing, 1], [incoming, 0]]) {
    m.rotation.set(Math.sin(t * .4) * .3, t * .35, 0);
    const [lo, hi] = bounds(m), u = m.material.uniforms;
    u.uTime.value = t; u.uProgress.value = progress; u.uOutgoing.value = out; u.uMinY.value = lo; u.uMaxY.value = hi;
  }
}
function frame(t) {                                                       // pure function of t
  const k = Math.floor(t / 4), local = t - k * 4, p = Math.min(1, Math.max(0, (local - 2) / 2));
  const [out, inc] = k % 2 ? [B, A] : [A, B];
  setState(t, p, out, inc); r.setClearColor(0x02060a, 1); r.render(scene, cam);
}
window.__seek = frame;
window.__sweepTest = () => {                                              // pixels of each colour at progress 0 and 1
  const gl = r.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, px = new Uint8Array(w * h * 4), out = {};
  for (const p of [0, 1]) {
    setState(1, p, A, B); r.setClearColor(0, 1); r.render(scene, cam); gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let cyan = 0, amber = 0;
    for (let i = 0; i < px.length; i += 4) { if (px[i + 2] > 40 && px[i + 2] > px[i] + 20) cyan++; else if (px[i] > 40 && px[i] > px[i + 2] + 20) amber++; }
    out['p' + p] = { cyan, amber };
  }
  frame(FIXED_T ?? 1); return out;
};
function size() { const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return; r.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); if (!raf) frame(FIXED_T ?? (reduce ? 1 : el)); }
let raf = 0, t0 = performance.now(), el = 0;
const live = () => FIXED_T === null && !reduce && !document.hidden;
const loop = now => { raf = requestAnimationFrame(loop); el = (now - t0) / 1000; frame(el); };
function sync() { if (!live() && raf) { cancelAnimationFrame(raf); raf = 0; } if (!raf) frame(FIXED_T ?? (reduce ? 1 : el)); if (live() && !raf) { t0 = performance.now() - el * 1000; raf = requestAnimationFrame(loop); } }
document.addEventListener('visibilitychange', sync);
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); raf = 0; });
canvas.addEventListener('webglcontextrestored', sync);
new ResizeObserver(size).observe(canvas); size(); sync();
window.__done = true;
})();
</script>
</html>
