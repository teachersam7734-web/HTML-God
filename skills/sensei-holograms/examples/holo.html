<!doctype html>
<!--
  holo.html: the hologram material. World-space fresnel rim (matrix * vector, never vector * matrix), world-space
  scanlines that ride the object, a slow bright sweep, a 10 per cent flicker (under the flash limits), a vertex glitch
  slab at hashed intervals, additive blending with a premultiplied-style alpha. Time is a uniform: seekable.
  The torus knot is a stand-in: put the same material on any glTF mesh (sensei-3d, examples/glb.html).
  Build: node ../../sensei-3d/scripts/build-vendor.mjs vendor entry-min.js
  verified: Windows 10, Chrome 155 + SwiftShader, three 0.186.1: gate3d.mjs passed (two times differ, live loop,
            reduced motion still with glitch off, context loss round trip, no network, no console errors).
  not verified: frame rate on a target GPU; the look on HDR or wide-gamut displays.
  Adapted from code-3d/holo.html in the HTML-Sensei build project's research notes (not shipped) (original code of this project): adds the pause control,
  offscreen pause, elapsed-time resume and the clear colour re-applied each frame (it does not survive a restore).
-->
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hologram material</title>
<style>
  html,body{margin:0;height:100%;background:#02060a;color:#dff;font:15px system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  button{position:fixed;left:16px;bottom:16px;font:inherit;color:#dff;background:#06141ccc;border:1px solid #35d8ff;border-radius:8px;padding:8px 14px;min-height:40px}
  button:focus-visible{outline:2px solid #35d8ff;outline-offset:2px}
</style>
<canvas id="c" role="img" aria-label="A turning knot drawn as a blue hologram"></canvas>
<button id="pause" type="button" aria-pressed="false">Pause motion</button>
<script src="vendor/t-min.js"></script>
<script>
(() => {
const { WebGLRenderer, Scene, PerspectiveCamera, ShaderMaterial, Mesh, TorusKnotGeometry, Color, AdditiveBlending, DoubleSide } = T;
const canvas = document.getElementById('c'), btn = document.getElementById('pause');
const mq = matchMedia('(prefers-reduced-motion: reduce)');
const q = new URLSearchParams(location.search);
const FIXED_T = q.has('t') ? parseFloat(q.get('t')) : null;

const renderer = new WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
const scene = new Scene();
const camera = new PerspectiveCamera(38, 1, 0.1, 100); camera.position.set(0, 0.2, 8.6);

const mat = new ShaderMaterial({
  transparent: true, depthWrite: false, blending: AdditiveBlending, side: DoubleSide,
  uniforms: { uTime: { value: 0 }, uColor: { value: new Color('#35d8ff') }, uGlitch: { value: 1 } },
  vertexShader: /* glsl */`
    uniform float uTime; uniform float uGlitch;
    varying vec3 vWorldPos; varying vec3 vWorldNormal;
    float hash(float n){ return fract(sin(n*127.1)*43758.5453); }
    void main(){
      vec4 w = modelMatrix * vec4(position, 1.0);             // matrix * vector: the transpose form drops translation
      float slot = floor(uTime * 6.0);                         // glitch: a thin slab jumps sideways at hashed intervals
      float bandY = hash(slot) * 4.0 - 2.0;
      float inBand = 1.0 - smoothstep(0.0, 0.18, abs(w.y - bandY));
      float on = step(0.82, hash(slot + 9.0));
      w.x += (hash(slot + 3.0) - 0.5) * 0.6 * inBand * on * uGlitch;
      vWorldPos = w.xyz;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);    // exact for uniform scale; otherwise the inverse transpose
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: /* glsl */`
    // colour space: authored in display space, no colorspace_fragment (decided on purpose)
    uniform float uTime; uniform vec3 uColor;
    varying vec3 vWorldPos; varying vec3 vWorldNormal;
    void main(){
      vec3 V = normalize(cameraPosition - vWorldPos);
      float fres = pow(1.0 - abs(dot(V, normalize(vWorldNormal))), 2.6);
      float scan = 0.5 + 0.5 * sin(vWorldPos.y * 90.0 - uTime * 6.0);           // world-space lines stick to the object
      scan = mix(0.35, 1.0, pow(scan, 3.0));
      float sweep = 1.0 - smoothstep(0.0, 0.35, abs(fract(uTime*0.25) * 6.0 - 3.0 - vWorldPos.y));
      float flick = 0.9 + 0.1 * sin(uTime * 53.0) * sin(uTime * 17.0);          // 10 per cent amplitude: below flash limits
      vec3 rgb = uColor * (0.22 + fres * 1.7 + sweep * 0.8) * scan * flick;
      gl_FragColor = vec4(rgb, max(rgb.r, max(rgb.g, rgb.b)));                 // premultiplied-style alpha
    }`
});
const mesh = new Mesh(new TorusKnotGeometry(1.3, 0.38, 220, 28), mat); scene.add(mesh);

let lastT = FIXED_T ?? 1.0;
function frame(t){                                       // pure function of t
  lastT = t;
  const still = mq.matches && FIXED_T === null;
  mat.uniforms.uTime.value = t;
  mat.uniforms.uGlitch.value = still ? 0 : 1;           // no glitch jumps under reduced motion
  mesh.rotation.y = t * 0.35; mesh.rotation.x = Math.sin(t * 0.4) * 0.25;
  renderer.setClearColor(0x02060a, 1);                  // per frame: survives a context restore
  renderer.render(scene, camera);
}
window.__seek = frame;

let raf = 0, t0 = 0, elapsed = lastT, paused = false, onScreen = true;
const running = () => raf !== 0;
const allowed = () => FIXED_T === null && !mq.matches && !paused && !document.hidden && onScreen;
function loop(now){ raf = requestAnimationFrame(loop); elapsed = (now - t0) / 1000; frame(elapsed); }
function sync(){
  const want = allowed();
  if (!want && running()) { cancelAnimationFrame(raf); raf = 0; }
  if (!running()) frame(mq.matches && FIXED_T === null ? 1.0 : (FIXED_T ?? elapsed));
  if (want && !running()) { t0 = performance.now() - elapsed * 1000; raf = requestAnimationFrame(loop); }
  btn.hidden = mq.matches || FIXED_T !== null;
  btn.textContent = paused ? 'Play motion' : 'Pause motion'; btn.setAttribute('aria-pressed', String(paused));
}
function size(){
  const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix(); if (!running()) frame(lastT);
}
btn.addEventListener('click', () => { paused = !paused; sync(); });
mq.addEventListener('change', sync);
document.addEventListener('visibilitychange', sync);
new IntersectionObserver(es => { onScreen = es[0].isIntersecting; sync(); }).observe(canvas);
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); raf = 0; });
canvas.addEventListener('webglcontextrestored', sync);
new ResizeObserver(size).observe(canvas); size();
sync();
window.__done = true;
})();
</script>
</html>
