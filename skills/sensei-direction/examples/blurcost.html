<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blur cost lab</title>
<!--
  blurcost.html: an animated ground with N glass panels (backdrop-filter) or one large animated filter:blur layer, for
  measuring the RELATIVE cost of blur with scripts/blur-cost.mjs. ?n=4&b=18 (panels, blur px), ?big=1 (one blurred
  layer). A measuring page, not a design: reduced motion stops the ground.
  verified: Windows 10, Chrome 155 headless, software raster: blur-cost.mjs ranks the variants as the research did.
  not verified: any real GPU or phone (the numbers are relative, never a reason to cut an effect).
  Origin: code-ui/blurcost.html in the HTML-Sensei build project's research notes (not shipped) (HTML-Sensei's own code).
-->
<style>
html,body{margin:0;height:100%;background:#120d2a;overflow:hidden}
.bg{position:fixed;inset:0}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;animation:m 6s ease-in-out infinite alternate}
.bg i:nth-child(1){background:radial-gradient(circle,#ff5d8f,transparent 62%);left:-10vmax;top:-10vmax}
.bg i:nth-child(2){background:radial-gradient(circle,#3dd6f5,transparent 62%);right:-10vmax;top:10vmax;animation-delay:-2s}
@keyframes m{to{transform:translate3d(20vmax,10vmax,0)}}
.grid{position:fixed;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:16px}
.p{border-radius:20px;border:1px solid rgba(255,255,255,.3);background:rgba(20,16,50,.38)}
.bf{backdrop-filter:blur(var(--b,18px)) saturate(160%);-webkit-backdrop-filter:blur(var(--b,18px)) saturate(160%)}
.blurbig{position:fixed;inset:-10%;filter:blur(60px);animation:m 6s ease-in-out infinite alternate;background:radial-gradient(circle at 30% 30%,#ff5d8f,transparent 50%),radial-gradient(circle at 70% 60%,#3dd6f5,transparent 50%)}
@media (prefers-reduced-motion:reduce){.bg i,.blurbig{animation:none}}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style></head>
<body><main><h1>Blur cost lab</h1><div class="bg" aria-hidden="true"><i></i><i></i></div><div class="blurbig" id="bb" hidden></div><div class="grid" id="g" aria-hidden="true"></div></main>
<script>
const q=new URLSearchParams(location.search),n=+q.get("n")||0,b=q.get("b")||"18",big=q.get("big");
const g=document.getElementById("g");
if(big){document.getElementById("bb").hidden=false;document.querySelector(".bg").style.display="none"}
g.style.setProperty("--b",b+"px");
for(let i=0;i<n;i++){const d=document.createElement("div");d.className="p bf";g.appendChild(d)}
window.__done=true;
</script></body></html>
