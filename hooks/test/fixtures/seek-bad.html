<!doctype html>
<!-- Fixture: a film page that breaks the seek contract. Not a real page. -->
<html><head><meta charset="utf-8"><style>
  .title { animation: pop 600ms ease-out both; }
  @keyframes pop { from { transform: scale(1.4) } to { transform: none } }
</style></head>
<body><div class="title">Title</div>
<script>
  let x = 0;
  const start = Date.now();
  setTimeout(() => document.body.classList.add('late'), 1200);
  window.seek = t => {
    x += Math.random() * 4;
    document.querySelector('.title').style.left = x + 'px';
  };
</script>
</body></html>
