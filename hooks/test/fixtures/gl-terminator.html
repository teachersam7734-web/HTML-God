     vec4 variable. Must warn on both. -->

<script>
  const gl = document.getElementById('c').getContext('webgl2');
  if (!gl) throw new Error('no WebGL');
  const note = "</script><script>alert(1)</script>";
  const vs = `#version 300 es
  in vec3 position; uniform mat4 modelViewMatrix, projectionMatrix;
  void main() { vec4 p = vec4(position, 1.0); gl_Position = projectionMatrix * (p * modelViewMatrix); }`;
  addEventListener('webglcontextlost', e => e.preventDefault());
