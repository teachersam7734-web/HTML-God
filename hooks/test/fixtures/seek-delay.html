<html lang="en"><head><meta charset="utf-8"><title>Seek by delay</title><style>

  @keyframes grow { to { transform: scaleX(1); } }
</style></head><body><div class="bar" id="b"></div>
<script>
  const bar = document.getElementById('b');

</script></body></html>
