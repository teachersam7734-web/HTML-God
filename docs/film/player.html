<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch HTML God</title><style>*{box-sizing:border-box}body{margin:0;background:#060b12;color:#eaf0ef;font:16px system-ui}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:22px;font-weight:500}section{aspect-ratio:16/9;position:relative}iframe{border:0;width:100%;height:100%}nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px 0}button,a{color:#e4c48f}button{background:#172b37;border:1px solid #53656d;border-radius:6px;padding:10px 20px;font:inherit;cursor:pointer}input[type=range]{accent-color:#e4c48f}#seek{flex:1;min-width:170px}a{display:inline-block;padding:10px 0}p{color:#9aadb7;line-height:1.6}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #9dd9e4;outline-offset:5px}</style></head><body><main><h1>HTML God - From idea to extraordinary HTML</h1><section><iframe id="stage" src="index.html" title="HTML God cinematic film"></iframe></section><nav aria-label="Film playback"><button id="play">Play film</button><label for="seek">Position</label><input id="seek" type="range" min="0" max="60" step="0.01" value="0"><output id="time">0:00 / 1:00</output><button id="mute" aria-pressed="true">Sound off</button><label>Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.65"></label></nav><audio id="sound" src="../assets/intro-soundtrack.m4a" preload="metadata"></audio><p id="notice">The film is paused and muted until you choose to play. It contains camera motion and brief iris transitions. No speech.</p><a href="../assets/intro-html-god.mp4">Open the 1080p MP4</a> · <a href="NOTE.md">Production notes and checks</a></main><script>const frame=document.querySelector('#stage'),sound=document.querySelector('#sound'),seek=document.querySelector('#seek'),play=document.querySelector('#play'),mute=document.querySelector('#mute'),volume=document.querySelector('#volume'),time=document.querySelector('#time');let running=false; sound.muted=true;sound.volume=.65;function paint(t){frame.contentWindow.__seek?.(t);seek.value=t;time.value=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')} / 1:00`;}function loop(){if(!running)return;paint(sound.currentTime);requestAnimationFrame(loop)}play.onclick=async()=>{if(running){sound.pause();running=false;play.textContent='Play film'}else{if(sound.currentTime>=59.9)sound.currentTime=0;try{await sound.play();running=true;play.textContent='Pause';loop()}catch{document.querySelector('#notice').textContent='Your browser could not play the soundtrack. Open the MP4 using the link below.'}}};seek.oninput=()=>{sound.currentTime=+seek.value;paint(+seek.value)};mute.onclick=()=>{sound.muted=!sound.muted;mute.textContent=sound.muted?'Sound off':'Sound on';mute.setAttribute('aria-pressed',String(sound.muted))};volume.oninput=()=>sound.volume=+volume.value;sound.onended=()=>{running=false;play.textContent='Replay film';paint(60)};document.addEventListener('visibilitychange',()=>{if(document.hidden){sound.pause();running=false;play.textContent='Play film'}});frame.onload=async()=>{await frame.contentWindow.__ready;paint(0)};if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelector('#notice').textContent='Reduced motion is enabled. The film stays paused; playback is your choice. You can also read the production notes below.';</script></body></html>
